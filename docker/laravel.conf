ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
    Options -Indexes
</Directory>

# Instance gratis hanya punya RAM terbatas (512 MB): batasi jumlah proses Apache.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 10
    MaxConnectionsPerChild 500
</IfModule>
